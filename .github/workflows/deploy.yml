name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # lets you re-deploy by hand from the Actions tab
  workflow_dispatch:

# the token needs to be allowed to publish a Pages site
permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; queue them instead
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A repo called <user>.github.io is served at the domain root; anything
      # else is served under /<repo>/. Guessing wrong breaks every asset, so
      # derive it rather than hard-coding it.
      - name: Work out the base path
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPO/" >> "$GITHUB_ENV"
          fi

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
