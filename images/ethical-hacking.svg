<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1232 770" width="1232" height="770"
     role="img" aria-label="Brute-force authentication assessment terminal cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f27"/>
      <stop offset="100%" stop-color="#12161c"/>
    </linearGradient>
  </defs>
  <rect width="1232" height="770" fill="url(#bg)"/>

  <!-- terminal window -->
  <rect x="146" y="140" width="940" height="490" rx="16" fill="#0d1117"
        stroke="#00eeff" stroke-opacity="0.25" stroke-width="2"/>
  <!-- title bar -->
  <rect x="146" y="140" width="940" height="46" rx="16" fill="#161b22"/>
  <rect x="146" y="170" width="940" height="16" fill="#161b22"/>
  <circle cx="176" cy="163" r="7" fill="#ff5f56"/>
  <circle cx="200" cy="163" r="7" fill="#ffbd2e"/>
  <circle cx="224" cy="163" r="7" fill="#27c93f"/>
  <text x="543" y="168" text-anchor="middle" fill="#8b949e"
        font-family="Consolas, Menlo, monospace" font-size="17">kali@wongzhiyoong: ~</text>

  <!-- terminal body -->
  <g font-family="Consolas, Menlo, monospace" font-size="20">
    <text x="180" y="240" fill="#00eeff">┌──(kali㉿wongzhiyoong)-[~]</text>
    <text x="180" y="270" fill="#00eeff">└─$ <tspan fill="#e6edf3">hydra -l admin -P passwords.txt \</tspan></text>
    <text x="180" y="300" fill="#e6edf3">     192.168.103.129 http-post-form</text>
    <text x="180" y="348" fill="#8b949e">[DATA] attacking http-post-form://192.168.103.129</text>
    <text x="180" y="378" fill="#8b949e">[DATA] max 16 tasks per 1 server ...</text>
    <text x="180" y="426" fill="#27c93f">[80][http-post-form] host: 192.168.103.129</text>
    <text x="212" y="452" fill="#27c93f">login: admin   password: ********</text>
    <text x="180" y="500" fill="#e6edf3">1 valid password found.</text>
    <text x="180" y="548" fill="#00eeff">└─$ <tspan fill="#e6edf3">_</tspan></text>
  </g>

  <text x="146" y="695" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700">Brute-Force Authentication Assessment</text>
  <text x="146" y="730" fill="#ffffff" fill-opacity="0.5"
        font-family="Consolas, Menlo, monospace" font-size="19" letter-spacing="2">
    KALI LINUX · HYDRA · BURP SUITE · NMAP · DVWA
  </text>
</svg>
