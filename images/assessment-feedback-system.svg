<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1232 770" width="1232" height="770"
     role="img" aria-label="Assessment Feedback System cover graphic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242b35"/>
      <stop offset="100%" stop-color="#171c24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00eeff"/>
      <stop offset="100%" stop-color="#00a6d6"/>
    </linearGradient>
  </defs>

  <rect width="1232" height="770" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 160h1232M0 320h1232M0 480h1232M0 640h1232"/>
    <path d="M205 0v770M410 0v770M616 0v770M822 0v770M1027 0v770"/>
  </g>

  <!-- monogram -->
  <g transform="translate(96 150)">
    <rect width="150" height="150" rx="34" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <text x="75" y="99" text-anchor="middle" fill="#00eeff"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700"
          letter-spacing="2">AFS</text>
  </g>

  <text x="96" y="380" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="700">Assessment</text>
  <text x="96" y="452" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="700">Feedback <tspan fill="#00eeff">System</tspan></text>

  <text x="96" y="512" fill="#ffffff" fill-opacity="0.6"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26">
    Coursework, submissions, grading and feedback across four roles
  </text>

  <!-- role chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">
    <g transform="translate(96 566)">
      <rect width="218" height="58" rx="29" fill="#00eeff" fill-opacity="0.12" stroke="#00eeff" stroke-opacity="0.5"/>
      <text x="109" y="37" text-anchor="middle" fill="#00eeff">Administrator</text>
    </g>
    <g transform="translate(330 566)">
      <rect width="248" height="58" rx="29" fill="#00eeff" fill-opacity="0.12" stroke="#00eeff" stroke-opacity="0.5"/>
      <text x="124" y="37" text-anchor="middle" fill="#00eeff">Academic Leader</text>
    </g>
    <g transform="translate(594 566)">
      <rect width="168" height="58" rx="29" fill="#00eeff" fill-opacity="0.12" stroke="#00eeff" stroke-opacity="0.5"/>
      <text x="84" y="37" text-anchor="middle" fill="#00eeff">Lecturer</text>
    </g>
    <g transform="translate(778 566)">
      <rect width="160" height="58" rx="29" fill="#00eeff" fill-opacity="0.12" stroke="#00eeff" stroke-opacity="0.5"/>
      <text x="80" y="37" text-anchor="middle" fill="#00eeff">Student</text>
    </g>
  </g>

  <text x="96" y="694" fill="#ffffff" fill-opacity="0.45"
        font-family="Consolas, Menlo, monospace" font-size="24" letter-spacing="3">
    JAVA · SWING · APACHE ANT
  </text>

  <rect x="0" y="762" width="1232" height="8" fill="url(#accent)"/>
</svg>
